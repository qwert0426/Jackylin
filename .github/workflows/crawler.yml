name: 台股資料庫爬蟲

on:
  schedule:
    - cron: "23 * * * *"   # 每小時第 23 分鐘自動執行（GitHub 排程可能延遲幾分鐘）
  workflow_dispatch:        # 也可以在 Actions 頁面手動按「Run workflow」
    inputs:
      only:
        description: "只執行某一步（留空 = 全部）：daily / finmind / holding / export / stats"
        required: false
        default: ""
      rebuild_stats:
        description: "重新統計覆蓋率"
        type: boolean
        default: false

concurrency:
  group: twstock-crawler
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      TZ: Asia/Taipei
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DB_CACHE_DIR: ${{ github.workspace }}/.dbcache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 還原本機快取（減少從 Google Drive 下載）
        uses: actions/cache/restore@v4
        with:
          path: .dbcache
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: 執行爬蟲 agent
        env:
          ONLY: ${{ github.event.inputs.only }}
          REBUILD: ${{ github.event.inputs.rebuild_stats }}
        run: |
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$REBUILD" = "true" ]; then ARGS+=(--rebuild-stats); fi
          python -m twstock_db.agent --minutes 50 "${ARGS[@]}"

      - name: 儲存本機快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .dbcache
          key: db-${{ github.run_id }}

      - name: 保持排程啟用（公開 repo 60 天沒動靜會自動停用排程）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/crawler.yml/enable" || true

      - name: 上傳儀表板
        if: always() && hashFiles('site_out/stats.json') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  dashboard:
    needs: crawl
    if: always() && needs.crawl.result != 'skipped'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
